      - html: pygarden/scrapers/mixins/html.md
      - html_soup: pygarden/scrapers/mixins/html_soup.md
      - json: pygarden/scrapers/mixins/json.md
      - request: pygarden/scrapers/mixins/request.md
      - websocket: pygarden/scrapers/mixins/websocket.md
      - xml: pygarden/scrapers/mixins/xml.md
      - xml_soup: pygarden/scrapers/mixins/xml_soup.md
    - scraper: pygarden/scrapers/scraper.md
    - seleniumscraper: pygarden/scrapers/seleniumscraper.md
    - static: pygarden/scrapers/static.md
    - webdriver: pygarden/scrapers/webdriver.md
plugins:
- search
- mkdocstrings:
    handlers:
      python:
        paths:
        - .
markdown_extensions:
- mkdocs-click
theme:
  name: material
  features:
  - navigation.sections
  - navigation.tracking
  - navigation.path
  - navigation.tabs
  - navigation.indexes
